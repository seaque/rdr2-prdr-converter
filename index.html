    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "PRDR to JPEG / PNG Converter",
        "url": "https://seaque.github.io/rdr2-prdr-converter/",

          "priceCurrency": "USD"
        }
      }
    </script>

    <!-- Initial theme setup before first paint -->
    <script>
      (function () {
        try {
          var pref = localStorage.getItem('rdr2-prdr-theme');
          var resolved =
            pref === 'dark' || pref === 'light'
              ? pref
              : window.matchMedia &&
                  window.matchMedia('(prefers-color-scheme: dark)').matches
                ? 'dark'
                : 'light';
          document.documentElement.dataset.theme = resolved;
          document.documentElement.style.colorScheme = resolved;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) {
            meta.setAttribute(
              'content',
              resolved === 'dark' ? '#0b0a09' : '#f3f3f3',
          }
        } catch (_err) {}
      })();
    </script>
